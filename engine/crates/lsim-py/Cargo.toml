[package]
name = "lsim-py"
description = "Python bindings (PyO3, built into a wheel with maturin): the module lightsim_engine that the lightsim package wraps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# maturin refuses a licence file outside the workspace (the repository's LICENSE is one
# level above engine/): the wheel names the licence instead
license = "LicenseRef-LightSim-Proprietary"
repository.workspace = true

[lib]
name = "lightsim_engine"
crate-type = ["cdylib", "rlib"]
# the tests of the bindings run from Python, against the built module
test = false
doctest = false

[features]
# set by maturin when it builds the wheel: do not link libpython
extension-module = ["pyo3/extension-module"]

[dependencies]
lsim-engine.workspace = true
lsim-ir.workspace = true
lsim-project.workspace = true
lsim-solve.workspace = true
numpy.workspace = true
pyo3.workspace = true
serde_json.workspace = true

[lints]
workspace = true
