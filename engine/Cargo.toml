# LightSim's simulation engine: an equation-based (acausal) modelling and
# simulation core. See DESIGN.md for the architecture and the work packages.
[workspace]
resolver = "3"
members = ["crates/*"]
# experiments/ hold one-off measurements with their own manifests and build
# needs; they are not part of the engine.
exclude = ["experiments"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license-file = "../LICENSE"
repository = "https://github.com/Eyad-3D/simstudio"

[workspace.dependencies]
# the engine's own crates
lsim-ir = { path = "crates/lsim-ir" }
lsim-lang = { path = "crates/lsim-lang" }
lsim-prep = { path = "crates/lsim-prep" }
lsim-codegen = { path = "crates/lsim-codegen" }
lsim-solve = { path = "crates/lsim-solve" }
lsim-fast = { path = "crates/lsim-fast" }
lsim-lib = { path = "crates/lsim-lib" }
lsim-project = { path = "crates/lsim-project" }
lsim-engine = { path = "crates/lsim-engine" }
lsim-sundials-sys = { path = "crates/lsim-sundials-sys" }

# third-party, exact versions (every licence is checked by scripts/licences.py)
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
sha2 = "=0.11.0"
cranelift-codegen = "=0.134.4"
cranelift-frontend = "=0.134.4"
cranelift-jit = "=0.134.4"
cranelift-module = "=0.134.4"
cranelift-native = "=0.134.4"
# the C compiler driver that builds the vendored SUNDIALS (lsim-sundials-sys)
cc = { version = "=1.6.0", features = ["parallel"] }
pyo3 = { version = "=0.29.3", features = ["abi3-py311"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
debug = "line-tables-only"

# The tests time the engine: keep them optimised.
[profile.test]
opt-level = 2
