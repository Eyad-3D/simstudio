# The engine computes every mathematical function with its own library,
# lsim-math (lsim_ir::math): correctly rounded, the same bits on every
# platform and CPU. The f64 and f32 methods below call the C runtime's
# instead (glibc, the MSVC UCRT), which differ in the last place between
# platforms and CPUs; clippy rejects them everywhere (check.sh and CI run
# it with warnings as errors), and lsim-math/tests/sources.rs checks this
# list is whole. powi is here too: on Windows it calls the C runtime's pow
# (Windows CI, October 2026), elsewhere it multiplies by repeated squaring.
# sqrt, exact in IEEE arithmetic, is not here on purpose.
disallowed-methods = [
    { path = "f64::sin", reason = "the platform's maths: use lsim_ir::math (lsim-math)" },
    { path = "f64::cos", reason = "the platform's maths: use lsim_ir::math (lsim-math)" },
    { path = "f64::tan", reason = "the platform's maths: use lsim_ir::math (lsim-math)" },
    { path = "f64::asin", reason = "the platform's maths: use lsim_ir::math (lsim-math)" },
    { path = "f64::acos", reason = "the platform's maths: use lsim_ir::math (lsim-math)" },
    { path = "f64::atan", reason = "the platform's maths: use lsim_ir::math (lsim-math)" },
    { path = "f64::atan2", reason = "the platform's maths: use lsim_ir::math (lsim-math)" },
    { path = "f64::sin_cos", reason = "the platform's maths: use lsim_ir::math (lsim-math)" },
    { path = "f64::sinh", reason = "the platform's maths: use lsim_ir::math (lsim-math)" },
