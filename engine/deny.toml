# cargo-deny settings (https://embarkstudios.github.io/cargo-deny/): the same
# licence policy as scripts/licences.py. Advisories need the advisory
# database from GitHub and are left to CI machines that can reach it.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Zlib", "0BSD", "BSL-1.0", "CC0-1.0", "Unicode-3.0",
    "Unicode-DFS-2016",
]

[licenses.private]
# the engine's own crates (publish = false) carry the project's licence
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
