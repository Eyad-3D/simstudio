# Builds the SimStudio desktop app for Windows and Linux.
#
# Both halves are platform-specific — the frozen Python backend and the
# Electron package — so each target builds on its own runner. Artifacts are
# attached to the run; pushing a v* tag also drafts a release.
name: Build desktop app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            builder: --linux
          - os: windows-latest
            name: windows
            builder: --win
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test the backend
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests/ -q

      - name: Freeze the backend
        working-directory: backend
        run: |
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --noconfirm --distpath dist --workpath build simstudio-backend.spec

      - name: Package the desktop app
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder ${{ matrix.builder }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: simstudio-${{ matrix.name }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
