# The lightsim Python wheel (AI-02): built and tested on every push and pull
# request that touches the engine; uploaded to PyPI for a version tag, but
# only once the owner has added the PYPI_API_TOKEN secret (an API token of
# the PyPI account that holds the "lightsim" name). Without it the upload
# step is skipped and says so. Every case runs on the new engine's module
# (the Rust module lightsim_engine, wheel "lightsim-engine"), which the
# lightsim wheel requires: each OS builds it here, as ci.yml does, and pip
# takes it from the built file (--find-links). The upload sends those
# engine wheels too; a first upload would still need a wheel tag PyPI
# accepts for Linux (manylinux) and a Windows wheel of the same version.
name: Python package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["backend/**", "engine/**", "scripts/build-wheel.py", "VERSION", ".github/workflows/python-package.yml"]
  workflow_dispatch:

jobs:
  wheel:
    name: Build and test the wheel
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The engine module's wheel, built as ci.yml and desktop-build.yml do
      # (the Rust release engine/rust-toolchain.toml pins), next to the
      # lightsim wheel
      - name: Build the engine module
        working-directory: engine
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          rustup toolchain install --no-self-update
          rustc --version
          python -m pip install "maturin>=1.7,<2"
          maturin build --release -m crates/lsim-py/Cargo.toml --out ../dist-wheel

      - name: Build
        run: python scripts/build-wheel.py --out dist-wheel

      # Installed into a clean environment, away from the repository
      - name: Install and run an example
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/bin/python" ]; then PY="$RUNNER_TEMP/venv/bin/python"; else PY="$RUNNER_TEMP/venv/Scripts/python.exe"; fi
          # the lightsim wheel requires lightsim-engine==<its version>: pip finds
          # it among the wheels built above, never on an index
          "$PY" -m pip install --find-links dist-wheel dist-wheel/lightsim-*.whl
          cd "$RUNNER_TEMP"
          "$PY" -m lightsim run bev-car --case "City Cycle"
          # Script blocks: every command-line run holds them to the strict OS
          # sandbox (an AppContainer on Windows, Landlock on Linux), whose worker
          # must start from the installed wheel (the engine is lightsim._app, and
          # pydantic is in this venv, not in the base interpreter)
          "$PY" -m lightsim run hybrid-car --case case-udds
          "$PY" -c "import lightsim as ls; r = ls.run('hybrid-car'); assert r.ok, r.status"

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: lightsim-wheel
          path: dist-wheel/lightsim-*.whl
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: engine-wheel-${{ matrix.os }}
          path: dist-wheel/lightsim_engine-*.whl
          retention-days: 30

  publish:
    name: Upload to PyPI
    needs: wheel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*wheel*"
          merge-multiple: true
          path: dist-wheel
      - name: Upload
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::No PYPI_API_TOKEN secret: the wheel was not uploaded."
            exit 0
          fi
          python -m pip install twine
          python -m twine upload --non-interactive -u __token__ -p "$TOKEN" dist-wheel/*.whl
