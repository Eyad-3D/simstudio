# The gate: fast checks that run on every push and pull request.
#
# Deliberately cheap (~3 min) so it can be a required check without slowing
# anyone down. The heavy desktop packaging lives in desktop-build.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt ruff

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Tests
        working-directory: backend
        # Includes the golden fixtures — the regression net for solver changes.
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  version:
    name: Version manifests in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node scripts/sync-version.mjs --check
