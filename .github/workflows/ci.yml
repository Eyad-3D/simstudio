# The gate: fast checks that run on every push and pull request.
#
# Deliberately cheap (~3 min; the browser tests ~6 min, in parallel) so it can
# be a required check without slowing anyone down. The heavy desktop
# packaging lives in desktop-build.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-screenshots:
        description: "Regenerate the screenshot baselines on this branch and commit them"
        type: boolean
        default: false

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt ruff

      - name: Lint
        working-directory: backend
        run: ruff check .

      # scripts/ has no ruff settings of its own: hold it to the backend's.
      - name: Lint scripts
        run: ruff check --config backend/pyproject.toml scripts/

      - name: Tests
        working-directory: backend
        # Includes the golden fixtures — the regression net for solver changes.
        env:
          GOLDEN_REPORT: ${{ runner.temp }}/golden-report.md
        run: python -m pytest tests/ -q

      # What the golden fixtures saw on this run: which headline numbers and
      # channels moved, old -> new and against which band
      # (backend/tests/golden/CHANGES.md explains the bands).
      - name: Golden diff report
        if: always()
        run: |
          {
            echo "## Golden fixtures"
            cat "${{ runner.temp }}/golden-report.md" 2>/dev/null \
              || echo "No report: the tests did not reach the golden fixtures."
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Frontend (browser tests + accessibility)
    # Pinned, not ubuntu-latest: Playwright 1.56.1 has no Chromium build for
    # Ubuntu 26.04, and the screenshot baselines are renders with 24.04's
    # fonts. The runner image, the @playwright/test version and the 18 PNGs in
    # e2e/visual.spec.ts-snapshots move together: bump Playwright and
    # regenerate the PNGs on the new image in the same PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The screenshots job below replaces this run when regenerating baselines.
    if: ${{ !inputs.update-screenshots }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the engine
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Install and build the UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The built UI against the real engine (started by playwright.config.ts
      # on a free port with a throw-away projects folder), plus the axe gate.
      - name: Browser tests
        working-directory: frontend
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # Regenerates the 18 screenshot baselines (frontend/e2e/visual.spec.ts) on
  # the e2e job's runner image and commits them to the branch. Renders from any
  # other machine differ in anti-aliasing by about 1 % of pixels, so baselines
  # made locally never match CI. After a deliberate UI change: Actions → CI →
  # Run workflow → pick the branch → tick "Regenerate the screenshot
  # baselines", then review the new PNGs in the pull request.
  screenshots:
    name: Regenerate screenshot baselines
    if: ${{ inputs.update-screenshots && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-24.04 # must match the e2e job
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the engine
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Install and build the UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Regenerate the baselines
        working-directory: frontend
        run: npm run test:visual:update

      - name: Commit changed baselines
        run: |
          git add frontend/e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate the screenshot baselines on the CI runner image"
          git push

  version:
    name: Version manifests in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node scripts/sync-version.mjs --check

  licences:
    name: Third-party licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install
        run: |
          python -m pip install -r backend/requirements-build.txt
          npm ci --prefix frontend
          npm ci --prefix desktop

      # What the engine ships is whatever PyInstaller collects, so freeze it
      # the way the desktop build does and read the result.
      - name: Freeze the engine
        working-directory: backend
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build lightsim-backend.spec

      # Fails on any shipped component whose licence is unknown or not in
      # scripts/licenses/allowed.txt (GPL, AGPL, SSPL and EUPL never are).
      - name: Check licences
        run: python scripts/third-party-notices.py --check
