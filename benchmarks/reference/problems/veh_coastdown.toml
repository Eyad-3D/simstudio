id = "veh_coastdown"
model = "vehicle_coastdown"
version = 1
domain = "vehicle"
title = "Car coasting down against air drag and rolling resistance, to a stop"
summary = "A 1500 kg car let go at 108 km/h against A + C v^2: closed-form speed, distance and stop."

statement = """
A car of mass m (no rotating inertia: it is in m) rolls on a level road
and is let go at speed v(0) with nothing driving or braking it. It is
slowed by a constant rolling resistance A and by air drag C v^2 (no wind).
Once stopped it stays stopped (rolling resistance does not push it back).
Find v(t) and the distance x(t), the time it takes to halve its speed,
the exact stop time and stopping distance, and how its kinetic energy
splits between the air and the tyres.
"""

equations = [
  "m dv/dt = -(A + C v^2)   while v > 0;  v = 0 after the stop",
  "dx/dt = v",
  "E_roll = integral of A v dt = A x;  E_aero = integral of C v^3 dt;  E_kin = m/2 (v^2 - v(0)^2)",
]

assumptions = [
  "Level road, still air, constant A and C (no speed dependence of the rolling resistance).",
  "The static rolling resistance holds the car at rest after the stop.",
]

solution = """
Separate: m dv / (A + C v^2) = -dt. With s = sqrt(A/C), phi0 = atan(v0/s) and
kappa = sqrt(A C)/m:
  v(t) = s tan(phi0 - kappa t),           0 <= t <= t_stop = phi0 / kappa,
  x(t) = (m/C) ln(cos(phi0 - kappa t) / cos(phi0)),
  x_stop = (m / (2C)) ln(1 + C v0^2 / A).
The time to reach a speed v_event is (phi0 - atan(v_event/s)) / kappa.
Energy: m v v' = -A v - C v^3, so E_aero = m/2 (v0^2 - v^2) - A x exactly
(verify.py integrates C v^3 on its own); E_roll + E_aero + E_kin = 0.
"""

[parameters]
m = { value = 1500.0, unit = "kg" }
A = { value = 150.0, unit = "N", note = "rolling resistance (c_rr 0.0102 at 1500 kg)" }
C = { value = 0.40, unit = "N/(m/s)^2", note = "0.5 rho Cd A_f (e.g. 1.2 kg/m^3, Cd 0.30, 2.22 m^2)" }
v_event = { value = 15.0, unit = "m/s", note = "t_event: the speed has halved" }

[initial]
v = { value = 30.0, unit = "m/s", note = "108 km/h" }
x = { value = 0.0, unit = "m" }

[run]
t_end = 220.0
output_dt = 0.1

[[compare]]
name = "v"
kind = "signal"
unit = "m/s"

[[compare]]
name = "x"
kind = "signal"
unit = "m"

[[compare]]
name = "t_event"
kind = "event"
unit = "s"
signal = "v"
level = 15.0
note = "the speed has halved"

[[compare]]
name = "t_stop"
kind = "event"
unit = "s"
signal = "v"
level = 0.0
note = "the car stops"

[[compare]]
name = "E_aero"
kind = "energy"
unit = "J"

[[compare]]
name = "E_roll"
kind = "energy"
unit = "J"

[[compare]]
name = "E_kin"
kind = "energy"
unit = "J"

[energy]
sources = []
sinks = ["E_aero", "E_roll", "E_kin"]

