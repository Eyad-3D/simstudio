id = "motor_dc_spinup"
model = "dc_motor"
version = 1
domain = "motor"
title = "DC motor spinning up from a voltage step (with winding inductance)"
summary = "A 48 V permanent-magnet DC motor, 0.5 mH winding, spins up an inertia from rest."

statement = """
A permanent-magnet DC motor (armature resistance R, inductance L, torque
and back-EMF constant k) drives a rigid inertia J (rotor and load) with
viscous friction b and a constant load torque T_load. At t = 0 the
terminal voltage steps from 0 to V with the motor at rest and no current.
Find the current i(t), the speed omega(t), the time the speed reaches 90 %
of its final value, and the energy the supply delivered, the winding
dissipated, the inductance and the inertia stored and the friction took.
"""

equations = [
  "L di/dt = V - R i - k omega",
  "J domega/dt = k i - b omega - T_load",
  "T_e = k i",
  "E_in = integral of V i dt;  E_R = integral of R i^2 dt;  E_L = L/2 (i^2 - i(0)^2)",
  "E_kin = J/2 (omega^2 - omega(0)^2);  E_friction = integral of b omega^2 dt;  E_load = integral of T_load omega dt",
]

assumptions = [
  "Linear magnetics (constant k and L), no brush drop, no cogging; ideal voltage source.",
  "T_load acts against the motion and the motor never turns backwards in the window.",
]

solution = """
Two linear states x = (i, omega), x' = M x + f with
  M = [[-R/L, -k/L], [k/J, -b/J]],  f = [V/L, -T_load/J].
x(t) = x_inf + e^(l1 t) P1 (x0 - x_inf) + e^(l2 t) P2 (x0 - x_inf), x_inf = -M^-1 f,
l1,2 the eigenvalues of M, P1 = (M - l2 I)/(l1 - l2), P2 = (M - l1 I)/(l2 - l1)
(mathx.linear2; here two real eigenvalues, about -5.137 and -194.868 1/s, so the
response is overdamped and the speed rises monotonically).
Final speed omega_inf = (k V - R T_load) / (k^2 + R b). The energies are
integrals of sums of exponentials, done exactly; E_in = E_R + E_L + E_kin +
E_friction + E_load. Event: the first t with omega = 0.9 omega_inf, found by
bisection on the closed form.
"""

[parameters]
V = { value = 48.0, unit = "V", note = "supply, a step at t = 0" }
R = { value = 0.1, unit = "ohm", note = "armature resistance" }
L = { value = 5.0e-4, unit = "H", note = "armature inductance (L/R = 5 ms)" }
k = { value = 0.1, unit = "N*m/A", note = "torque constant = back-EMF constant in V*s/rad" }
J = { value = 0.02, unit = "kg*m^2", note = "rotor + load (mechanical tau J R / k^2 = 0.2 s)" }
b = { value = 1.0e-4, unit = "N*m*s/rad", note = "viscous friction" }
T_load = { value = 0.0, unit = "N*m" }
event_fraction = { value = 0.9, unit = "1", note = "t_event: omega reaches this share of omega_inf" }
t_search = { value = 1.5, unit = "s", note = "where the event is looked for (exact.py)" }

[initial]
i = { value = 0.0, unit = "A" }
omega = { value = 0.0, unit = "rad/s" }

[run]
t_end = 1.5
output_dt = 1.0e-3

[[compare]]
name = "omega"
kind = "signal"
unit = "rad/s"

[[compare]]
name = "i"
kind = "signal"
unit = "A"

[[compare]]
name = "t_event"
kind = "event"
unit = "s"
signal = "omega"
level = 431.5684315684316
note = "omega reaches 90 % of its final value"

[[compare]]
name = "E_in"
kind = "energy"
unit = "J"

[[compare]]
name = "E_R"
kind = "energy"
unit = "J"

[[compare]]
name = "E_L"
kind = "energy"
unit = "J"

[[compare]]
name = "E_kin"
kind = "energy"
unit = "J"

[[compare]]
name = "E_friction"
kind = "energy"
unit = "J"

[energy]
sources = ["E_in"]
sinks = ["E_R", "E_L", "E_kin", "E_friction", "E_load"]

