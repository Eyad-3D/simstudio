id = "batt_cc_rc"
model = "battery_cc"
version = 1
domain = "battery"
title = "Battery (OCV + R0 + one RC pair) at constant current"
summary = "A 60 Ah pack with a linear OCV discharged at 120 A (2C) for 10 minutes."

statement = """
A battery pack modelled as an equivalent circuit: an open-circuit voltage
that is linear in the state of charge, OCV(SOC) = ocv_a + ocv_b SOC, in
series with a resistance R0 and one parallel R1-C1 pair (time constant
tau1 = R1 C1). From SOC(0) with the RC pair relaxed, a constant discharge
current I (positive out of the pack) is drawn from t = 0. Find the
terminal voltage V(t), SOC(t) and the RC pair's voltage v1(t), and the
energy the cells gave up (chemical), the terminals delivered, R0 and R1
dissipated and C1 stored.
"""

equations = [
  "dSOC/dt = -I / (3600 Q_Ah)            (coulombic efficiency 1)",
  "dv1/dt = I / C1 - v1 / (R1 C1),  C1 = tau1 / R1",
  "V = OCV(SOC) - R0 I - v1,  OCV(SOC) = ocv_a + ocv_b SOC",
  "E_chem = integral of OCV I dt;  E_terminal = integral of V I dt",
  "E_R0 = integral of R0 I^2 dt;  E_R1 = integral of v1^2 / R1 dt;  E_C1 = C1/2 (v1^2 - v1(0)^2)",
  "E_internal = E_R0 + E_R1 + E_C1 = E_chem - E_terminal",
]

assumptions = [
  "SOC is a fraction (0-1); Q_Ah the charge capacity; no temperature effect.",
  "The current steps from 0 to I at t = 0: V jumps by -R0 I, v1 is continuous.",
  "Constant parameters (R0, R1, tau1 do not depend on SOC or current).",
]

solution = """
SOC(t) = SOC0 - I t / (3600 Q_Ah) (linear), v1(t) = I R1 + (v1(0) - I R1) e^(-t/tau1),
so V(t) = ocv_a + ocv_b SOC(t) - R0 I - v1(t) in closed form. The energies are
integrals of polynomials times exponentials, done exactly (exact.py, ExpPoly):
with v1(0) = 0, E_R1 = I^2 R1 (t - 2 tau1 (1 - e^(-t/tau1)) + tau1/2 (1 - e^(-2t/tau1))),
E_C1 = C1/2 (I R1)^2 (1 - e^(-t/tau1))^2, and E_R1 + E_C1 = I integral(v1) dt =
I^2 R1 (t - tau1 (1 - e^(-t/tau1))), so E_chem = E_terminal + E_R0 + E_R1 + E_C1.
"""

[parameters]
I = { value = 120.0, unit = "A", note = "discharge current (2C), a step at t = 0" }
Q_Ah = { value = 60.0, unit = "A*h", note = "charge capacity" }
ocv_a = { value = 340.0, unit = "V", note = "OCV at SOC = 0" }
ocv_b = { value = 60.0, unit = "V", note = "OCV rise from SOC 0 to 1 (400 V full)" }
R0 = { value = 0.08, unit = "ohm" }
R1 = { value = 0.04, unit = "ohm" }
tau1 = { value = 30.0, unit = "s", note = "R1 C1 (C1 = 750 F)" }

[initial]
SOC = { value = 0.9, unit = "1" }
v1 = { value = 0.0, unit = "V" }

[run]
t_end = 600.0
output_dt = 0.5

[[compare]]
name = "V"
kind = "signal"
unit = "V"

[[compare]]
name = "SOC"
kind = "signal"
unit = "1"

[[compare]]
name = "I"
kind = "signal"
unit = "A"

[[compare]]
name = "v1"
kind = "signal"
unit = "V"
scale = 4.8
note = "scaled by its final value I R1, not by the terminal voltage"

[[compare]]
name = "E_chem"
kind = "energy"
unit = "J"

[[compare]]
name = "E_terminal"
kind = "energy"
unit = "J"

[[compare]]
name = "E_R0"
kind = "energy"
unit = "J"

[[compare]]
name = "E_R1"
kind = "energy"
unit = "J"

[[compare]]
name = "E_C1"
kind = "energy"
unit = "J"

[[compare]]
name = "E_internal"
kind = "energy"
unit = "J"
note = "R0 + R1 + C1 together, for an engine that books them as one loss"

[energy]
sources = ["E_chem"]
sinks = ["E_terminal", "E_R0", "E_R1", "E_C1"]

