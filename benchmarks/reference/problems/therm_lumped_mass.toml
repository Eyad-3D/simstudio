id = "therm_lumped_mass"
model = "thermal_lumped"
version = 1
domain = "thermal"
title = "Lumped thermal mass heated, then cooling"
summary = "A motor stator (15 kJ/K, 20 W/K to the coolant) takes 1.5 kW for 20 minutes, then cools."

statement = """
A body of heat capacity C exchanges heat with surroundings at T_amb
through a conductance G (convection, a cooling jacket). It starts at T(0).
From t = 0 to t_off a constant heat P is generated in it (copper losses);
after t_off nothing. Find T(t), the time it reaches T_hot while heating,
the time it falls back to T_cool after the heat is switched off, and the
energy balance.
"""

equations = [
  "C dT/dt = P(t) - G (T - T_amb),  P(t) = P for t < t_off, 0 after",
  "E_heat = integral of P(t) dt;  E_ambient = integral of G (T - T_amb) dt;  E_stored = C (T - T(0))",
]

assumptions = [
  "One uniform temperature in the body (Biot number << 1); constant C and G; T_amb constant.",
]

solution = """
Linear, first order, tau = C/G. Heating: T = T_inf + (T(0) - T_inf) e^(-t/tau),
T_inf = T_amb + P/G. Cooling from T_off = T(t_off): T = T_amb + (T_off - T_amb) e^(-(t - t_off)/tau).
t_hot = tau ln((T_inf - T(0)) / (T_inf - T_hot)),
t_cool = t_off + tau ln((T_off - T_amb) / (T_cool - T_amb)).
E_ambient is the integral of an exponential per phase (exact); E_heat = E_ambient + E_stored.
"""

[parameters]
C = { value = 15000.0, unit = "J/K", note = "heat capacity (tau = C/G = 750 s)" }
G = { value = 20.0, unit = "W/K", note = "conductance to the surroundings" }
P = { value = 1500.0, unit = "W", note = "heat generated until t_off (T_inf = 100 C)" }
t_off = { value = 1200.0, unit = "s" }
T_amb = { value = 25.0, unit = "degC" }
T_hot = { value = 80.0, unit = "degC", note = "t_hot: reached while heating" }
T_cool = { value = 50.0, unit = "degC", note = "t_cool: reached while cooling" }

[initial]
T = { value = 25.0, unit = "degC" }

[run]
t_end = 3000.0
output_dt = 1.0

[[compare]]
name = "T"
kind = "signal"
unit = "degC"
scale = 75.0
note = "scaled by the temperature rise P/G, not by the Celsius value"

[[compare]]
name = "t_hot"
kind = "event"
unit = "s"
signal = "T"
level = 80.0
direction = "rising"

[[compare]]
name = "t_cool"
kind = "event"
unit = "s"
signal = "T"
level = 50.0
direction = "falling"

[[compare]]
name = "E_heat"
kind = "energy"
unit = "J"

[[compare]]
name = "E_ambient"
kind = "energy"
unit = "J"

[[compare]]
name = "E_stored"
kind = "energy"
unit = "J"

[energy]
sources = ["E_heat"]
sinks = ["E_ambient", "E_stored"]

