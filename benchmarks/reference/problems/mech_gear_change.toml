id = "mech_gear_change"
model = "gear_change"
version = 1
domain = "mechanical"
title = "Gear change: an instantaneous ratio change between a motor and its load"
summary = "A motor at constant torque accelerates a vehicle-sized inertia in a 12:1 gear and shifts to 7:1 at t = 4 s."

statement = """
A motor (rotor inertia J1) delivers a constant torque T through an ideal,
lossless gear to a load inertia J2 (here a vehicle's mass reflected to its
wheels, m r^2). The ratio i = omega1/omega2 is i1 until t_shift and i2
after it. The shift is instantaneous and rigid: the new gear engages
without torque interruption or slip, as an ideal dog clutch would. Find
both speeds before and after the shift, the speed jump at the shift, the
kinetic energy the shift loses, and the energy balance.
"""

equations = [
  "omega1 = i omega2,  i = i1 for t < t_shift, i2 after",
  "(J2 + i^2 J1) domega2/dt = i T",
  "at t_shift: J2 omega2 + i2 J1 omega1 is kept (the gear's impulse acts on both shafts)",
  "E_drive = integral of T omega1 dt;  E_kin = change of J1 omega1^2/2 + J2 omega2^2/2;  E_shift = the kinetic energy lost at t_shift",
]

assumptions = [
  "Rigid shafts, lossless gears, no torque interruption; the engagement is a perfectly inelastic impulse.",
  "An engine that instead keeps one shaft's speed through the shift and sets the other's from the new ratio creates or destroys kinetic energy at the shift; this problem detects that.",
]

solution = """
Before the shift: omega2 = omega2(0) + T i1 t / (J2 + i1^2 J1), omega1 = i1 omega2.
At the shift the new gear meets the shafts turning at omega1- = i1 omega2-; an
impulse L acts on the motor as -L and on the load as +i2 L (power-conserving
gear), so J2 omega2 + i2 J1 omega1 is unchanged, and with omega1+ = i2 omega2+:
  omega2+ = (J2 + i1 i2 J1) omega2- / (J2 + i2^2 J1).
(It is the clutch problem with infinite capacity: an inelastic collision of
J1 with the load reflected through i2.) The kinetic energy lost is
  E_shift = (J2 + i1^2 J1) omega2-^2 / 2 - (J2 + i2^2 J1) omega2+^2 / 2 > 0.
After the shift: omega2 = omega2+ + T i2 (t - t_shift) / (J2 + i2^2 J1).
E_drive = T theta1 with theta1 the motor's (continuous) angle; E_drive = E_kin + E_shift.
Here omega2 jumps from 67.511 to 68.370 rad/s (+1.27 %) and 2.80 kJ is lost.
"""

[parameters]
J1 = { value = 0.05, unit = "kg*m^2", note = "motor rotor" }
J2 = { value = 135.0, unit = "kg*m^2", note = "load: a 1500 kg vehicle on 0.3 m wheels, m r^2" }
T = { value = 200.0, unit = "N*m", note = "constant motor torque" }
i1 = { value = 12.0, unit = "1", note = "first gear, omega1/omega2" }
i2 = { value = 7.0, unit = "1", note = "second gear" }
t_shift = { value = 4.0, unit = "s" }

[initial]
omega2 = { value = 0.0, unit = "rad/s", note = "omega1 = i1 omega2" }

[run]
t_end = 8.0
output_dt = 0.01

[[compare]]
name = "omega2"
kind = "signal"
unit = "rad/s"

[[compare]]
name = "omega1"
kind = "signal"
unit = "rad/s"

[[compare]]
name = "E_drive"
kind = "energy"
unit = "J"

[[compare]]
name = "E_kin"
kind = "energy"
unit = "J"

[[compare]]
name = "E_shift"
kind = "energy"
unit = "J"

[energy]
sources = ["E_drive"]
sinks = ["E_kin", "E_shift"]

