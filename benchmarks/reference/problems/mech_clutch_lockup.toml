id = "mech_clutch_lockup"
model = "clutch_lockup"
version = 1
domain = "mechanical"
title = "Dry clutch engaging two inertias: slip, then lock-up at an exact time"
summary = "An engine-side inertia at 250 rad/s is clutched onto a load at rest; they lock at t = 250/420 s."

statement = """
Two inertias, J1 (driving side: engine, flywheel, clutch plate) and J2
(driven side: gearbox input, reflected load), are joined at t = 0 by a dry
clutch pressed with a constant force: its friction torque is T_c while it
slips (against the slip) and anything up to T_c once locked. A constant
drive torque T_drive acts on J1 and a constant load torque T_load on J2
(against the motion). J1 starts faster than J2. Find both speeds, the
clutch torque, the lock-up time and the energy the clutch dissipated.
"""

equations = [
  "slip s = omega1 - omega2",
  "s > 0:  J1 domega1/dt = T_drive - T_c,   J2 domega2/dt = T_c - T_load",
  "locked: omega1 = omega2 = omega,  (J1 + J2) domega/dt = T_drive - T_load,",
  "        the clutch passes T = (J2 T_drive + J1 T_load) / (J1 + J2), |T| <= T_c",
  "E_drive = integral of T_drive omega1 dt;  E_load = integral of T_load omega2 dt",
  "E_clutch = integral of T_clutch s dt;  E_kin = change of J1 omega1^2/2 + J2 omega2^2/2",
]

assumptions = [
  "Kinetic and static friction torque are both T_c (no stick-slip overshoot), engaged fully at t = 0.",
  "Rigid shafts (no torsional compliance).",
  "t_lock is reported as the time the slip falls to eps_lock (a hair before the exact meeting, so an engine that approaches lock-up smoothly can be compared): t_lock = (s0 - eps_lock) / rate.",
]

solution = """
While slipping both accelerations are constant, so the slip falls linearly:
s(t) = s0 - rate t, rate = (T_c - T_drive)/J1 + (T_c - T_load)/J2 (> 0),
and the speeds meet at t_meet = s0 / rate (here 250/420 = 0.595238 s) at
omega_lock = omega1(0) + (T_drive - T_c) t_meet / J1. After that they turn
together with (T_drive - T_load)/(J1 + J2); the clutch then passes
(J2 T_drive + J1 T_load)/(J1 + J2) = 16 N m < T_c, so it stays locked.
The clutch dissipates T_c s0 t_meet / 2 (its torque times the mean slip);
with no drive and load torque that is the textbook J1 J2/(J1 + J2) s0^2 / 2.
E_drive = E_load + E_clutch + E_kin at every t.
"""

[parameters]
J1 = { value = 0.25, unit = "kg*m^2", note = "driving side" }
J2 = { value = 1.0, unit = "kg*m^2", note = "driven side" }
T_c = { value = 100.0, unit = "N*m", note = "clutch friction torque (kinetic = static capacity)" }
T_drive = { value = 20.0, unit = "N*m", note = "constant torque on J1" }
T_load = { value = 0.0, unit = "N*m", note = "constant torque on J2 against the motion" }
eps_lock = { value = 0.1, unit = "rad/s", note = "slip at which t_lock is reported" }

[initial]
omega1 = { value = 250.0, unit = "rad/s" }
omega2 = { value = 0.0, unit = "rad/s" }

[run]
t_end = 1.5
output_dt = 0.01

[[compare]]
name = "omega1"
kind = "signal"
unit = "rad/s"

[[compare]]
name = "omega2"
kind = "signal"
unit = "rad/s"

[[compare]]
name = "T_clutch"
kind = "signal"
unit = "N*m"

[[compare]]
name = "t_lock"
kind = "event"
unit = "s"
signal = "slip"
level = 0.1
note = "the slip falls to eps_lock"

[[compare]]
name = "E_drive"
kind = "energy"
unit = "J"

[[compare]]
name = "E_clutch"
kind = "energy"
unit = "J"

[[compare]]
name = "E_kin"
kind = "energy"
unit = "J"

[energy]
sources = ["E_drive"]
sinks = ["E_load", "E_clutch", "E_kin"]

# ---- checkpoints: generated by `python -m benchmarks.reference.export --checkpoints`
# (the exact answer at these times, to the last digit; edit the problem, then regenerate)
[checkpoints]
times = [0.38, 0.75, 1.12, 1.5]
omega1 = [128.4, 61.99999999999999, 67.92, 74.0]
omega2 = [38.0, 61.99999999999999, 67.92, 74.0]
T_clutch = [100.0, 16.0, 16.0, 16.0]
E_drive = [1437.92, 2030.4761904761904, 2511.1801904761905, 3050.4761904761904]
E_clutch = [6467.6, 7440.476190476192, 7440.476190476192, 7440.476190476192]
E_kin = [-5029.68, -5410.0, -4929.296, -4390.0]
E_load = [0.0, 0.0, 0.0, 0.0]

[checkpoints.events]
t_lock = 0.595
