id = "elec_rc_step"
model = "rc_step"
version = 1
domain = "electrical"
title = "RC circuit: DC-link precharge from a voltage step"
summary = "A 400 V source charges a 1 mF DC-link capacitor through a 50 ohm precharge resistor."

statement = """
An ideal voltage source V is switched on at t = 0 and charges a capacitor C
through a series resistor R (an inverter's DC-link precharge). The
capacitor starts at v_C(0). Find the capacitor voltage v_C(t) and current
i(t) over five time constants, the time the capacitor reaches 95 % of V
(precharge done), and the energy the source delivered, the resistor
dissipated and the capacitor stored.
"""

equations = [
  "C dv_C/dt = i",
  "i = (V - v_C) / R",
  "E_source = integral of V i dt;  E_R = integral of R i^2 dt;  E_C = C/2 (v_C^2 - v_C(0)^2)",
]

assumptions = [
  "Ideal source (no internal resistance) and ideal capacitor (no leakage, no ESR).",
  "The source steps from 0 to V at t = 0: i(0+) = (V - v_C(0)) / R.",
]

solution = """
Linear, first order, time constant tau = R C:
  v_C(t) = V + (v_C(0) - V) e^(-t/tau),  i(t) = (V - v_C(0))/R e^(-t/tau).
With v_C(0) = 0: E_source = C V^2 (1 - e^(-t/tau)), E_C = C V^2/2 (1 - e^(-t/tau))^2,
E_R = C V^2/2 (1 - e^(-2t/tau)); E_source = E_R + E_C at every t, and as
t -> infinity half the source's energy is lost in R whatever R is.
Event: v_C = f V at t = tau ln((V - v_C(0)) / (V - f V)); f = 0.95 gives tau ln 20.
"""

[parameters]
V = { value = 400.0, unit = "V", note = "source voltage, a step at t = 0" }
R = { value = 50.0, unit = "ohm", note = "precharge resistor" }
C = { value = 1.0e-3, unit = "F", note = "DC-link capacitance (tau = 50 ms)" }
event_fraction = { value = 0.95, unit = "1", note = "t_event: v_C reaches this share of V" }

[initial]
v_C = { value = 0.0, unit = "V" }

[run]
t_end = 0.25
output_dt = 1.0e-3

[[compare]]
name = "v_C"
kind = "signal"
unit = "V"

[[compare]]
name = "i"
kind = "signal"
unit = "A"

[[compare]]
name = "t_event"
kind = "event"
unit = "s"
signal = "v_C"
level = 380.0
note = "v_C reaches 95 % of V (precharge done)"

[[compare]]
name = "E_source"
kind = "energy"
unit = "J"

[[compare]]
name = "E_R"
kind = "energy"
unit = "J"

[[compare]]
name = "E_C"
kind = "energy"
unit = "J"

[energy]
sources = ["E_source"]
sinks = ["E_R", "E_C"]

