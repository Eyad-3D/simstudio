id = "elec_rl_step"
model = "rl_step"
version = 1
domain = "electrical"
title = "RL circuit: contactor coil energised from a voltage step"
summary = "A 12 V supply energises a 24 ohm, 0.6 H contactor coil; when does it pull in?"

statement = """
An ideal voltage source V is switched on at t = 0 across a coil of
inductance L and resistance R (a main contactor's coil). The current
starts at i(0). Find the current i(t) and the inductor voltage v_L(t), the
time the current reaches the pull-in current i_event, and the energy the
source delivered, the resistance dissipated and the magnetic field stored.
"""

equations = [
  "L di/dt = V - R i",
  "v_L = L di/dt = V - R i",
  "E_source = integral of V i dt;  E_R = integral of R i^2 dt;  E_L = L/2 (i^2 - i(0)^2)",
]

assumptions = [
  "Linear inductance (no saturation), no eddy currents, ideal source.",
  "The armature does not move in the window (the inductance stays L).",
]

solution = """
Linear, first order, time constant tau = L/R, final current i_inf = V/R:
  i(t) = i_inf + (i(0) - i_inf) e^(-t/tau).
With i(0) = 0: E_source = V i_inf (t - tau (1 - e^(-t/tau))),
E_R = R i_inf^2 (t - 2 tau (1 - e^(-t/tau)) + tau/2 (1 - e^(-2t/tau))),
E_L = L i_inf^2/2 (1 - e^(-t/tau))^2, and E_source = E_R + E_L.
Event: i = i_event at t = tau ln((i_inf - i(0)) / (i_inf - i_event)).
"""

[parameters]
V = { value = 12.0, unit = "V", note = "supply, a step at t = 0" }
R = { value = 24.0, unit = "ohm", note = "coil resistance" }
L = { value = 0.6, unit = "H", note = "coil inductance (tau = 25 ms, i_inf = 0.5 A)" }
i_event = { value = 0.3, unit = "A", note = "pull-in current" }

[initial]
i = { value = 0.0, unit = "A" }

[run]
t_end = 0.15
output_dt = 5.0e-4

[[compare]]
name = "i"
kind = "signal"
unit = "A"

[[compare]]
name = "v_L"
kind = "signal"
unit = "V"

[[compare]]
name = "t_event"
kind = "event"
unit = "s"
signal = "i"
level = 0.3
note = "the current reaches the pull-in current"

[[compare]]
name = "E_source"
kind = "energy"
unit = "J"

[[compare]]
name = "E_R"
kind = "energy"
unit = "J"

[[compare]]
name = "E_L"
kind = "energy"
unit = "J"

[energy]
sources = ["E_source"]
sinks = ["E_R", "E_L"]

