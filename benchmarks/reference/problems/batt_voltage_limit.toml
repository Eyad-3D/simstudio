id = "batt_voltage_limit"
model = "battery_voltage_limit"
version = 1
domain = "battery"
title = "Battery reaching its minimum voltage: constant current, then held at the limit"
summary = "The 60 Ah pack at 120 A from half charge hits its 352 V limit; the BMS then holds 352 V."

statement = """
The pack of batt_cc_rc (linear OCV, R0, one RC pair), starting at SOC(0)
with the RC pair relaxed, is discharged at a constant current I. Its
terminal voltage falls (R0 drop, the RC pair charging, the OCV falling) and
reaches the minimum voltage V_min at t*. From then on the battery
management holds the terminal voltage at V_min: the current is whatever
keeps V = V_min, and it decays (constant-voltage discharge). Find t*,
V(t), I(t) and SOC(t) before and after it, and the energy terms.
"""

equations = [
  "dSOC/dt = -I / (3600 Q_Ah);  dv1/dt = I / C1 - v1 / (R1 C1),  C1 = tau1 / R1",
  "V = OCV(SOC) - R0 I - v1,  OCV(SOC) = ocv_a + ocv_b SOC",
  "t < t*: I = I_cc;   t >= t*: V = V_min, so I = (OCV(SOC) - v1 - V_min) / R0",
  "t* = the first t with V(t) = V_min",
]

assumptions = [
  "The limit acts instantly and exactly (an ideal constant-voltage hold); the current never reverses after t*.",
  "V(0+) = OCV(SOC0) - R0 I > V_min, and v1(0) <= I R1.",
]

solution = """
Before t*, as in batt_cc_rc: V(t) = A - B t + C e^(-t/tau1) with
A = ocv_a + ocv_b SOC0 - R0 I - R1 I, B = ocv_b I / (3600 Q_Ah), C = I R1 - v1(0).
V(t*) = V_min: with D = A - V_min and s = t* - D/B, B s = C e^(-D/(B tau1)) e^(-s/tau1),
i.e. (s/tau1) e^(s/tau1) = z, so
  t* = D/B + tau1 W0(z),  z = C / (B tau1) e^(-D/(B tau1))
(Lambert's W, principal branch; V is strictly falling, so t* is unique).
After t*: x = (SOC, v1) obeys x' = M x + f with
  M = [[-k ocv_b/R0, k/R0], [ocv_b/(R0 C1), -1/(R0 C1) - 1/tau1]],
  f = [-k (ocv_a - V_min)/R0, (ocv_a - V_min)/(R0 C1)],  k = 1/(3600 Q_Ah),
solved through M's two real eigenvalues from (SOC(t*), v1(t*)) (mathx.linear2);
the current is continuous at t* (it is I there) and decays towards 0 as the
OCV falls to V_min. Energies as in batt_cc_rc, integrated exactly per phase.
"""

[parameters]
I = { value = 120.0, unit = "A", note = "constant discharge current before the limit" }
V_min = { value = 352.0, unit = "V", note = "minimum terminal voltage" }
Q_Ah = { value = 60.0, unit = "A*h" }
ocv_a = { value = 340.0, unit = "V" }
ocv_b = { value = 60.0, unit = "V" }
R0 = { value = 0.08, unit = "ohm" }
R1 = { value = 0.04, unit = "ohm" }
tau1 = { value = 30.0, unit = "s" }

[initial]
SOC = { value = 0.5, unit = "1" }
v1 = { value = 0.0, unit = "V" }

[run]
t_end = 400.0
output_dt = 0.5

[[compare]]
name = "t_vmin"
kind = "event"
unit = "s"
signal = "V"
level = 352.0
note = "the terminal voltage reaches V_min"

[[compare]]
name = "V"
kind = "signal"
unit = "V"

[[compare]]
name = "I"
kind = "signal"
unit = "A"

[[compare]]
name = "SOC"
kind = "signal"
unit = "1"

[[compare]]
name = "E_terminal"
kind = "energy"
unit = "J"

[[compare]]
name = "E_chem"
kind = "energy"
unit = "J"

[[compare]]
name = "E_R0"
kind = "energy"
unit = "J"

[[compare]]
name = "E_R1"
kind = "energy"
unit = "J"

[[compare]]
name = "E_C1"
kind = "energy"
unit = "J"

[[compare]]
name = "E_internal"
kind = "energy"
unit = "J"
note = "R0 + R1 + C1 together"

[energy]
sources = ["E_chem"]
sinks = ["E_terminal", "E_R0", "E_R1", "E_C1"]

