id = "batt_cp_rc"
model = "battery_cp"
version = 1
domain = "battery"
title = "Battery (OCV + R0 + one RC pair) at constant power"
summary = "A pack with a flat 380 V OCV and strong polarisation delivers 60 kW for two minutes."

statement = """
A battery pack: a constant open-circuit voltage E in series with R0 and
one parallel R1-C1 pair (tau1 = R1 C1), RC pair relaxed at t = 0. From
t = 0 the terminals deliver a constant power P = V I. As the RC pair
charges, the terminal voltage sags and the current rises to keep the power.
Find I(t), V(t), v1(t) and SOC(t), and the energy terms of the balance.
"""

equations = [
  "V I = P,  V = E - R0 I - v1   (I the smaller root: R0 I^2 - (E - v1) I + P = 0)",
  "dv1/dt = I / C1 - v1 / (R1 C1),  C1 = tau1 / R1",
  "dSOC/dt = -I / (3600 Q_Ah)",
  "E_chem = integral of E I dt;  E_terminal = P t;  E_R0 = integral of R0 I^2 dt",
  "E_R1 = integral of v1^2 / R1 dt;  E_C1 = C1/2 (v1^2 - v1(0)^2)",
]

assumptions = [
  "Flat OCV (SOC does not change E), so the SOC does not feed back.",
  "The operating point is the high-voltage (low-current) root of the power equation.",
  "P below the steady maximum power: E^2 > 4 (R0 + R1) P.",
]

solution = """
Write the state through the current x = I: with u = E - v1, u = R0 x + P/x, and
du/dt = -dv1/dt gives
  dt/dx = tau1 (R0 x^2 - P) / (x (E x - (R0 + R1) x^2 - P))
        = -tau1/(R0+R1) (R0 x^2 - P) / (x (x - a)(x - b)),
a < b the roots of (R0 + R1) x^2 - E x + P = 0 (a is the steady current).
So t(I) = integral from I(0) to I of that rational function: polynomial
division and partial fractions over the simple poles 0, a, b give logs in
closed form (mathx.rational_integral); I(t) is t(I) inverted (monotone,
bisected to the last bit). The charge Q = integral of I dt and integral of I^2 dt
are the same integrals with an extra x or x^2. Then V = P/I,
v1 = E - R0 I - P/I, SOC = SOC0 - Q/(3600 Q_Ah), E_chem = E Q, E_R0 = R0 integral I^2 dt,
E_C1 from v1, and E_R1 = E_chem - P t - E_R0 - E_C1 (the RC pair takes I v1;
its resistor dissipates what its capacitor does not store). verify.py
integrates v1^2/R1 on its own to check that last one.
"""

[parameters]
P = { value = 60000.0, unit = "W", note = "terminal power, a step at t = 0" }
E = { value = 380.0, unit = "V", note = "open-circuit voltage (flat)" }
R0 = { value = 0.05, unit = "ohm" }
R1 = { value = 0.15, unit = "ohm", note = "strong polarisation (a cold pack)" }
tau1 = { value = 20.0, unit = "s", note = "R1 C1 (C1 = 133.3 F)" }
Q_Ah = { value = 60.0, unit = "A*h" }

[initial]
SOC = { value = 0.9, unit = "1" }
v1 = { value = 0.0, unit = "V" }

[run]
t_end = 120.0
output_dt = 0.1

[[compare]]
name = "I"
kind = "signal"
unit = "A"

[[compare]]
name = "V"
kind = "signal"
unit = "V"

[[compare]]
name = "SOC"
kind = "signal"
unit = "1"

[[compare]]
name = "E_chem"
kind = "energy"
unit = "J"

[[compare]]
name = "E_terminal"
kind = "energy"
unit = "J"

[[compare]]
name = "E_R0"
kind = "energy"
unit = "J"

[[compare]]
name = "E_R1"
kind = "energy"
unit = "J"

[[compare]]
name = "E_C1"
kind = "energy"
unit = "J"

[[compare]]
name = "E_internal"
kind = "energy"
unit = "J"
note = "R0 + R1 + C1 together"

[energy]
sources = ["E_chem"]
sinks = ["E_terminal", "E_R0", "E_R1", "E_C1"]

