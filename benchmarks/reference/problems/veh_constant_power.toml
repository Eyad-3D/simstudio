id = "veh_constant_power"
model = "vehicle_constant_power"
version = 1
domain = "vehicle"
title = "Car accelerating at constant power"
summary = "60 kW at the wheels takes a 1500 kg car from 18 km/h to 100 km/h in 9.33 s."

statement = """
A car of mass m (rotating inertia included in m) on a level road with no
resistance receives a constant tractive power P at the wheels (traction
force P/v, an ideal power-limited drive above its base speed) from speed
v(0) > 0 on. Find v(t), the distance x(t), the time to reach 100 km/h and
the energy balance.
"""

equations = [
  "m dv/dt = P / v",
  "dx/dt = v",
  "E_supplied = P t;  E_kin = m/2 (v^2 - v(0)^2)",
]

assumptions = [
  "No air drag, rolling resistance or grade; no wheel slip; P reaches the road without loss.",
  "v(0) > 0 (the force P/v is unbounded at standstill).",
]

solution = """
m v dv = P dt, so v(t) = sqrt(v0^2 + 2 P t / m) and
x(t) = (m / (3P)) ((v0^2 + 2 P t / m)^(3/2) - v0^3).
The time to reach v1 is m (v1^2 - v0^2) / (2P). E_supplied = E_kin at every t.
"""

[parameters]
m = { value = 1500.0, unit = "kg" }
P = { value = 60000.0, unit = "W", note = "tractive power at the wheels" }
v_event = { value = 27.777777777777779, unit = "m/s", note = "100 km/h" }

[initial]
v = { value = 5.0, unit = "m/s", note = "18 km/h" }
x = { value = 0.0, unit = "m" }

[run]
t_end = 15.0
output_dt = 0.01

[[compare]]
name = "v"
kind = "signal"
unit = "m/s"

[[compare]]
name = "x"
kind = "signal"
unit = "m"

[[compare]]
name = "t_event"
kind = "event"
unit = "s"
signal = "v"
level = 27.777777777777779
note = "the car reaches 100 km/h"

[[compare]]
name = "E_supplied"
kind = "energy"
unit = "J"

[[compare]]
name = "E_kin"
kind = "energy"
unit = "J"

[energy]
sources = ["E_supplied"]
sinks = ["E_kin"]

