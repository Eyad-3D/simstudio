id = "motor_dc_spinup_l0"
model = "dc_motor"
version = 1
domain = "motor"
title = "DC motor spinning up from a voltage step (winding inductance neglected)"
summary = "The 48 V motor of motor_dc_spinup with L = 0, as system-level motor models usually are."

statement = """
The motor and inertia of motor_dc_spinup with the winding inductance
neglected (L = 0): the current follows the speed at once,
i = (V - k omega)/R, so it jumps to V/R at t = 0. Find omega(t), i(t), the
time to 90 % of the final speed and the energy terms.
"""

equations = [
  "i = (V - k omega) / R",
  "J domega/dt = k i - b omega - T_load",
  "E_in = integral of V i dt;  E_R = integral of R i^2 dt;  E_kin = J/2 (omega^2 - omega(0)^2)",
  "E_friction = integral of b omega^2 dt;  E_load = integral of T_load omega dt",
]

assumptions = [
  "As motor_dc_spinup, with L = 0 (no electrical state).",
]

solution = """
One linear state: J omega' = -(k^2/R + b) omega + (k V/R - T_load), so
  omega(t) = omega_inf + (omega(0) - omega_inf) e^(-t/tau_m),
  tau_m = J / (k^2/R + b),  omega_inf = (k V - R T_load) / (k^2 + R b).
From rest the 90 % time is tau_m ln 10. i(t) = (V - k omega)/R; the energies
are integrals of exponentials, done exactly; E_in = E_R + E_kin + E_friction + E_load.
"""

[parameters]
V = { value = 48.0, unit = "V", note = "supply, a step at t = 0" }
R = { value = 0.1, unit = "ohm" }
L = { value = 0.0, unit = "H", note = "neglected" }
k = { value = 0.1, unit = "N*m/A" }
J = { value = 0.02, unit = "kg*m^2" }
b = { value = 1.0e-4, unit = "N*m*s/rad" }
T_load = { value = 0.0, unit = "N*m" }
event_fraction = { value = 0.9, unit = "1" }
t_search = { value = 1.5, unit = "s" }

[initial]
i = { value = 0.0, unit = "A", note = "unused with L = 0: the current is set by the speed" }
omega = { value = 0.0, unit = "rad/s" }

[run]
t_end = 1.5
output_dt = 0.01

[[compare]]
name = "omega"
kind = "signal"
unit = "rad/s"

[[compare]]
name = "i"
kind = "signal"
unit = "A"

[[compare]]
name = "t_event"
kind = "event"
unit = "s"
signal = "omega"
level = 431.5684315684316
note = "omega reaches 90 % of its final value"

[[compare]]
name = "E_in"
kind = "energy"
unit = "J"

[[compare]]
name = "E_R"
kind = "energy"
unit = "J"

[[compare]]
name = "E_kin"
kind = "energy"
unit = "J"

[[compare]]
name = "E_friction"
kind = "energy"
unit = "J"

[energy]
sources = ["E_in"]
sinks = ["E_R", "E_kin", "E_friction", "E_load"]

