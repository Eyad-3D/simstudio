id = "mech_inertia_coastdown"
model = "inertia_coastdown"
version = 1
domain = "mechanical"
title = "Rotating inertia coasting down against viscous and Coulomb friction"
summary = "A 0.5 kg m^2 rotor let go at 300 rad/s stops in exactly (J/c) ln(1 + c omega0 / T_c)."

statement = """
A rigid inertia J spins at omega(0) and is let go at t = 0. Nothing drives
it; it is slowed by viscous friction c omega and by Coulomb (dry) friction
of constant magnitude T_c against the motion. Once stopped it stays at
rest (the dry friction's static limit is at least T_c and nothing else
acts). Find omega(t), the angle turned theta(t), the exact stop time, and
how the initial kinetic energy splits between the two frictions.
"""

equations = [
  "J domega/dt = -c omega - T_c sign(omega)   while omega > 0",
  "omega = 0 for t >= t_stop (stuck)",
  "dtheta/dt = omega",
  "E_viscous = integral of c omega^2 dt;  E_coulomb = integral of T_c |omega| dt = T_c theta",
  "E_kin = J/2 (omega^2 - omega(0)^2)   (negative: the kinetic energy given up)",
]

assumptions = [
  "Static friction >= T_c, so the inertia does not start again after stopping.",
  "Kinetic friction is exactly T_c at any non-zero speed (no Stribeck effect).",
]

solution = """
While omega > 0 the equation is linear: omega(t) = (omega0 + T_c/c) e^(-c t/J) - T_c/c,
so omega = 0 at t_stop = (J/c) ln(1 + c omega0 / T_c) (finite: the dry friction
stops it, the viscous part alone would not). theta(t) = (J/c)(omega0 + T_c/c)(1 - e^(-c t/J))
- (T_c/c) t until t_stop, then constant. E_viscous is the integral of a sum of
exponentials (exact); at every t, E_viscous + E_coulomb + E_kin = 0.
"""

[parameters]
J = { value = 0.5, unit = "kg*m^2" }
c = { value = 0.01, unit = "N*m*s/rad", note = "viscous coefficient (J/c = 50 s)" }
T_c = { value = 2.0, unit = "N*m", note = "Coulomb friction torque" }

[initial]
omega = { value = 300.0, unit = "rad/s" }
theta = { value = 0.0, unit = "rad" }

[run]
t_end = 60.0
output_dt = 0.05

[[compare]]
name = "omega"
kind = "signal"
unit = "rad/s"

[[compare]]
name = "theta"
kind = "signal"
unit = "rad"

[[compare]]
name = "t_stop"
kind = "event"
unit = "s"
signal = "omega"
level = 0.0
note = "the inertia stops (and stays stopped)"

[[compare]]
name = "E_viscous"
kind = "energy"
unit = "J"

[[compare]]
name = "E_coulomb"
kind = "energy"
unit = "J"

[[compare]]
name = "E_kin"
kind = "energy"
unit = "J"

[energy]
sources = []
sinks = ["E_viscous", "E_coulomb", "E_kin"]

# ---- checkpoints: generated by `python -m benchmarks.reference.export --checkpoints`
