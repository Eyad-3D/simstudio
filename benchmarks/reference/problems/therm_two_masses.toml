id = "therm_two_masses"
model = "thermal_two_masses"
version = 1
domain = "thermal"
title = "Two coupled thermal masses: battery cells on a cooled plate"
summary = "1 kW of heat in a 40 kJ/K cell mass, through 50 W/K to a 10 kJ/K plate, through 40 W/K to the coolant."

statement = """
Two bodies: mass 1 (battery cells, heat capacity C1) where a constant heat
P is generated from t = 0, and mass 2 (cold plate and coolant, C2). Heat
flows from 1 to 2 through the conductance G12 and from 2 to the
surroundings at T_amb through G2a. Both start at T_amb. Find T1(t) and
T2(t) (two time constants), the time the cells reach T1_event, and the
energy balance.
"""

equations = [
  "C1 dT1/dt = P - G12 (T1 - T2)",
  "C2 dT2/dt = G12 (T1 - T2) - G2a (T2 - T_amb)",
  "E_heat = P t;  E_ambient = integral of G2a (T2 - T_amb) dt;  E_stored1 = C1 (T1 - T1(0));  E_stored2 = C2 (T2 - T2(0))",
  "E_12 = integral of G12 (T1 - T2) dt   (the heat passed from 1 to 2)",
]

assumptions = [
  "Each body at one uniform temperature; constant capacities and conductances.",
]

solution = """
Linear with two states, T' = M T + f:
  M = [[-G12/C1, G12/C1], [G12/C2, -(G12 + G2a)/C2]],  f = [P/C1, G2a T_amb / C2].
M's eigenvalues are real and negative (here about -5.135e-4 and -9.736e-3 1/s:
time constants of about 1947 s and 103 s); T(t) = T_inf + sum over the two of
e^(l t) P_l (T(0) - T_inf), T_inf = -M^-1 f (mathx.linear2). In steady state
T2 = T_amb + P/G2a = 50 C and T1 = T2 + P/G12 = 70 C. Energies are integrals
of exponentials (exact); E_heat = E_ambient + E_stored1 + E_stored2.
The event time is found by bisection on the closed form.
"""

[parameters]
C1 = { value = 40000.0, unit = "J/K", note = "cells" }
C2 = { value = 10000.0, unit = "J/K", note = "cold plate and coolant" }
G12 = { value = 50.0, unit = "W/K", note = "cells to plate" }
G2a = { value = 40.0, unit = "W/K", note = "plate to surroundings" }
P = { value = 1000.0, unit = "W", note = "heat generated in the cells" }
T_amb = { value = 25.0, unit = "degC" }
T1_event = { value = 50.0, unit = "degC", note = "t_event: the cells reach it" }
t_search = { value = 7200.0, unit = "s" }

[initial]
T1 = { value = 25.0, unit = "degC" }
T2 = { value = 25.0, unit = "degC" }

[run]
t_end = 7200.0
output_dt = 5.0

[[compare]]
name = "T1"
kind = "signal"
unit = "degC"
scale = 45.0
note = "scaled by the steady rise of T1"

[[compare]]
name = "T2"
kind = "signal"
unit = "degC"
scale = 25.0
note = "scaled by the steady rise of T2"

[[compare]]
name = "t_event"
kind = "event"
unit = "s"
signal = "T1"
level = 50.0
note = "the cells reach 50 C"

[[compare]]
name = "E_heat"
kind = "energy"
unit = "J"

[[compare]]
name = "E_ambient"
kind = "energy"
unit = "J"

[[compare]]
name = "E_stored1"
kind = "energy"
unit = "J"

[[compare]]
name = "E_stored2"
kind = "energy"
unit = "J"

[[compare]]
name = "E_12"
kind = "energy"
unit = "J"

[energy]
sources = ["E_heat"]
sinks = ["E_ambient", "E_stored1", "E_stored2"]

