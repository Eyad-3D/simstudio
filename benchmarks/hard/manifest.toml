what = "sundials_ours, after its first run (R16): each run ends at the time the example's solver returned, unrounded (the example run as shipped with each return time printed in full), not at the .out's rounded time; idaSlCrank_dns's rows (no '|' column) are read."
why = "R16 ran to the printed times, which idasAkzoNob_dns rounds to 3 digits (1.12e-06 for 1.1237e-06): its y3, which grows in proportion to t there, then missed by 0.3 %, a harness error, not the engine's. idaSlCrank_dns's rows were not read at all. The allowances are unchanged."

