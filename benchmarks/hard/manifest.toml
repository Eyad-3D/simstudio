# Step 3's hard problems: the pre-registered manifest.
#
# Written and committed BEFORE any case below was run (by us or by an outside
# tool). Every case states its expected outcome. A later change goes in a
# dated [[changes]] entry at the end with its reason; the rows above it are
# not edited.
#
# Sources of this phase (phase 1):
#   * the IVP Test Set 2.4 (F. Mazzia, C. Magherini, University of Bari),
#     https://archimede.uniba.it/~testset - research use only: fetched at test
#     time into the cache, never committed; SciMLBenchmarks.jl (MIT) is the
#     second copy of its problems;
#   * SUNDIALS 7.1.1's serial dense examples with their .out files (LLNL,
#     BSD-3-Clause).
# Later phases (not here): the Modelica library 4.1.0 via OpenModelica,
# ARGESIM C21, ScalableTestSuite, Tan-Nedialkov-Pryce, ModelingToolkit,
# generators (a) and (b), mutation and coverage.

version = 1
registered = "2026-11-12"

# ---------------------------------------------------------------------------
# What "expected" means
# ---------------------------------------------------------------------------
[criteria]
rtols = [1e-4, 1e-5, 1e-6, 1e-7, 1e-8, 1e-9, 1e-10]
atol = "equal to rtol (the test set's own runs use rtol = atol = h0)"
ours = "IDA (every block kept implicit: force_implicit) and diffsol, each at every rtol"
outside = "RADAU5, DASSL and PSIDE from the test set, built here with gfortran, at the same rtol = atol = h0"
scd = """The test set's own measure (src/auxil/report.f, getscd): scd = -log10 of the
largest relative error at the end time over the components the test set does
not skip (andrews 1-7, crank 1-7 and 22-24, nand 5, pump 1-8, tba 224, 305
and 323, fekete 1-60, plei 1-14, beam 1-40, emep all but 36 and 38; every
component of the others), only components whose reference is at least 1e-200
in size; mescd likewise with the error over (atol/rtol + |reference|) over all
components."""
transcription = """A transcription is right when, at each reference point (the
start values, the reference solution at the end, and three points near each
of them moved by a relative 1e-3 with seeds 1, 2, 3), every one of its
equations' residuals agrees with the gfortran-built original's
(M y' - f(t, y), or the implicit residual) to 1e-13, relative to the largest
term of that row (1 where every term is below 1). A case whose transcription
fails this is not run until fixed."""
result = """E1: no refusal and no stop (a sound model refused is a FAILURE, a false
refusal). E2: at each rtol, scd >= (the best scd any outside solver reached at
that rtol) - 1; where no outside solver succeeded, scd >= -log10(rtol) - 3.
E3: the error falls with the tolerance: scd(1e-10) - scd(1e-4) >= 3, and no
tighter rtol loses more than 1 digit against the looser one before it. A run
that ends with no message and scd < 1 where E2 asks for more is a SILENT WRONG
ANSWER."""
refusal = """A refusal is right when its code is the one named and its message names
the part (here: the variable) named. A refusal with another code that names
the right part is counted as naming the part, the code mismatch listed."""
counts = "steps, residual/function evaluations, Jacobian evaluations and Newton-matrix factorisations (LU), never seconds"
sundials_c = """SUNDIALS' own C examples built here against the release the engine
vendors (7.1.1) print the shipped .out's numbers to every printed digit and
the same step, function-evaluation and setup counts."""
sundials_ours = """Our run of a SUNDIALS example's transcription prints each value the
.out prints, at its time, within 100 times the example's own rtol (relative)
plus its atol; each root the example reports, at its time within the same."""

# ---------------------------------------------------------------------------
# The six failure kinds
# ---------------------------------------------------------------------------
[[kind]]
id = "singular-structural"
what = "more or fewer equations than unknowns somewhere: no unique solution by structure"
expect = "refusal STRUCT-UNDER or STRUCT-OVER naming the variable"
phase1 = ["derived-chemakzo-no-algebraic", "derived-hires-extra-equation"]
later = "step 2's 160-fault corpus with the 'names the planted part' column; mutation (generator b)"

[[kind]]
id = "singular-numerical"
what = "the structure is fine but the Newton or index-reduction matrix is singular at the start or on the way"
expect = "refusal (code stated per case) naming the variable"
phase1 = ["derived-andrews-massless"]
later = "Tan-Nedialkov-Pryce, manufactured index (generator a)"

[[kind]]
id = "inconsistent-start"
what = "start values that break an algebraic equation, or derivatives the test set gives inconsistent"
expect = "a warning INIT-START-IGNORED naming the variable, then the result of the consistent problem"
phase1 = ["derived-chemakzo-y6-start"]
later = "generators (a), Modelica library examples"

[[kind]]
id = "chattering"
what = "a switch that the solution keeps crossing (sliding mode)"
expect = "a result that slides, or RUN-EVENT-STORM naming the switching variable"
phase1 = []
later = "ARGESIM C21; no source of phase 1 chatters (said here so the empty row is not a gap)"

[[kind]]
id = "stiff"
what = "very fast and very slow parts at once"
expect = "result (criteria.result)"
phase1 = ["ivp-hires", "ivp-pollu", "ivp-ringmod", "ivp-vdpol", "ivp-vdpolm", "ivp-orego", "ivp-rober", "ivp-e5",
          "ivp-medakzo", "ivp-emep", "ivp-chemakzo", "ivp-transamp", "ivp-beam",
          "sun-cvRoberts_dns", "sun-idaRoberts_dns", "sun-idasAkzoNob_dns"]

[[kind]]
id = "high-index"
what = "hidden constraints index reduction must find, including large swings (index 3 in at position level)"
expect = "result (criteria.result)"
phase1 = ["ivp-andrews", "ivp-caraxis", "ivp-crank", "ivp-fekete", "ivp-pump", "ivp-water", "ivp-wheel",
          "ivp-plei", "sun-idaSlCrank_dns", "sun-cvPendulum_dns"]
large_swings = "step 1's judge pendulums released up to 3.14 rad and the IFToMM four-bar (engine/judge, not rerun here)"

[[kind]]
id = "discontinuous"
what = "a right-hand side that jumps or kinks in time or in the state"
expect = "result (criteria.result)"
phase1 = ["ivp-medakzo", "ivp-nand", "ivp-pump", "ivp-tba", "ivp-water", "ivp-beam",
          "sun-cvRoberts_dns", "sun-idaRoberts_dns", "sun-cvDisc_dns"]

