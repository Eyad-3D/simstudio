id = "build-add-climate"
kind = "build"
version = 1
title = "Put the cabin heat pump back into a hatchback model"
statement = """
car.json models our electric hatchback. While testing, a colleague deleted its
cabin climate system. Put it back as a heat pump, and save the model in
car.json:

- a Climate Control part, fed from the high-voltage battery through the same
  bus the other loads use, and returned to ground as they are;
- heat source "Heat pump" (its minimum operating temperature at LightSim's
  default), cabin set point 22 °C, fan 0.3 kW;
- LightSim's default heating and cooling demand table.

Change nothing else. The model must pass LightSim's Data Checks with no errors
or warnings. The case "WLTC winter, first 600 s" (-7 °C outside) shows the
result.
"""

[[start]]
file = "car.json"
from = "example:bev-car"
name = "Compact hatchback"
ops = [
  { op = "remove", element = "Climate Control" },
  { op = "add_case", name = "WLTC winter, first 600 s", id = "case-winter-600", copy_of = "case-wltc-winter", duration = 600 },
]

[reference]
file = "car.json"
ops = [
  { op = "add", type = "electric.climate", label = "Climate Control" },
  { op = "connect", from = "HV Bus:t4", to = "Climate Control:pos" },
  { op = "connect", from = "Climate Control:neg", to = "Ground:t2" },
  { op = "set", element = "Climate Control", param = "heat_source", value = "Heat pump" },
  { op = "set", element = "Climate Control", param = "cabin_setpoint_C", value = 22 },
  { op = "set", element = "Climate Control", param = "fan_power_kW", value = 0.3 },
]

# Added with the part's defaults: a resistive (PTC) heater.
[wrong]
file = "car.json"
base = "reference"
ops = [{ op = "set", element = "Climate Control", param = "heat_source", value = "PTC heater" }]

[check]
file = "car.json"
case = "WLTC winter, first 600 s"
params = [
  { type = "electric.climate", key = "heat_source", value = "Heat pump" },
  { type = "electric.climate", key = "cabin_setpoint_C", value = 22, rtol = 0.002 },
  { type = "electric.climate", key = "fan_power_kW", value = 0.3, rtol = 0.002 },
]
figures = [
  { key = "consumption_kwh_per_100km", rtol = 0.02 },
  { key = "*.energy_used_kwh", rtol = 0.03 },
  { key = "*.final_soc_pct", atol = 0.15 },
]
