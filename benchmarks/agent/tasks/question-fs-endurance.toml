id = "question-fs-endurance"
kind = "question"
version = 1
title = "Does the lighter, smaller accumulator last the endurance event?"
statement = """
car.json models our Formula Student car with a smaller accumulator (10 Ah
instead of 14 Ah) and a lighter chassis (270 kg). The case "Endurance energy"
runs the 23-lap endurance event at the 30 kW power cap. How far does the car
get before the accumulator is empty, in km (the event is 22.5 km), and how
much battery energy does the car use per lap, in kWh?

End your reply with one line in exactly this form, numbers only:
ANSWER: <distance>; <energy per lap>
"""

[[start]]
file = "car.json"
from = "example:fs-electric"
name = "FS car, small accumulator"
ops = [
  { op = "set", element = "Accumulator", param = "capacity_Ah", value = 10 },
  { op = "set", element = "Vehicle", param = "mass_kg", value = 270 },
]

# The finished event of the example's own car.
[wrong]
answer = "ANSWER: 22.5; 0.2319"

# The energy the accumulator delivered over the 21 laps, without what braking
# put back: outside the band of both readings.
[[also_wrong]]
answer = "ANSWER: 20.557; 0.2741"

# The distance of one reading with the energy of the other.
[[also_wrong]]
answer = "ANSWER: 20.557; 0.2351"

# "Before the accumulator is empty" reads two ways, and both are right: the
# run's Distance driven (21 laps), or where the charge reaches its 5 %
# minimum (t = 1263 s), after which the car coasts on. The second reading's
# distance is the vehicle's distance channel at that moment, 20.023 km. Its
# energy per lap is either the run's own Energy per lap (as the first
# reading) or the battery's net energy (delivered less recuperated,
# 4.717 kWh) over the laps up to there, 0.2305 kWh; a test works the
# figures out from the run. So there are three right answers, each taken as
# a whole (also[0] and also[1] are the second and third): the run's
# distance goes only with the run's energy per lap.
# The run's own Energy per lap is that net energy over the 21 laps driven.
# LightSim marks it not valid because the event did not finish, not because
# the number is wrong for the question, so the key keeps it.
[[answer]]
value = 20.557
rtol = 0.01
also = [{ value = 20.023 }, { value = 20.023 }]
figure = { file = "car.json", case = "Endurance energy", key = "distance_km" }

# The brief names no precision, so the band takes the energy to two decimals:
# 0.22 is 2.06 % off 0.22462 (the comparison of 6 November failed five tries
# with the 2 % band it had then). 2.5 % still fails the mixed readings below
# (0.2319 is 3.2 % off, 0.231 2.8 %). The price: 20.56 with 0.23 (the other
# energy to two decimals) is 2.4 % off and passes, since two decimals cannot
# tell the readings' energies apart; a brief that names the precision would.
[[answer]]
value = 0.22462
rtol = 0.025
also = [{ value = 0.2305 }, { value = 0.22462 }]
figure = { file = "car.json", case = "Endurance energy", key = "energy_per_lap_kwh" }
